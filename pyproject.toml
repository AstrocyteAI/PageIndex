# Packaging metadata added by the AstrocyteAI fork so this repo is
# pip/uv-installable as the `pageindex` import package. Upstream
# (VectifyAI/PageIndex) ships no packaging metadata. Astrocyte's
# PageIndex bench (scripts/bench_pageindex_{lme,locomo}.py) imports
# `from pageindex import md_to_tree`; we consume it as an installed
# dependency instead of via a hardcoded sys.path.
#
# Chat completions use the OpenAI SDK, which the Astrocyte bench env already
# installs (astrocyte[openai]); it is not declared here so this package does not
# constrain the bench env's resolution. OPENAI_BASE_URL points it at an AISIX
# gateway for other providers.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pageindex"
version = "0.0.0"
description = "VectifyAI/PageIndex vendored for the Astrocyte bench harness (AstrocyteAI fork + packaging metadata)."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.26",
    "PyPDF2>=3.0",
    "pyyaml>=6.0",
    # openai is intentionally omitted — see header comment.
    "tiktoken>=0.12",
    "python-dotenv>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["pageindex*"]
